<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Shinji Shinkawa — Full-stack development and AI workflows</title>
  <desc id="desc">A dark navy technical profile card with blue grid lines and a terminal-style system panel.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1b30"/>
      <stop offset="1" stop-color="#102844"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25d0ff"/>
      <stop offset="1" stop-color="#1687ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#65d8ff" stroke-width="1" opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono { font-family: "DejaVu Sans Mono", "Liberation Mono", Consolas, monospace; font-style: normal; }
      .label { fill: #7f9bb8; font-size: 12px; letter-spacing: 1px; }
      .value { fill: #e8f6ff; font-size: 13px; letter-spacing: 0.3px; }
    </style>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#background)"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)"/>
  <path d="M0 330 C210 275 390 390 620 320 S990 255 1200 305 V400 H0Z" fill="#1687ff" opacity="0.06"/>
  <circle cx="1115" cy="65" r="130" fill="#25d0ff" opacity="0.05"/>

  <g transform="translate(64 62)" class="mono">
    <g>
      <circle cx="7" cy="7" r="7" fill="#25d0ff" filter="url(#glow)"/>
      <text x="29" y="12" fill="#78dcff" font-size="13" letter-spacing="1.5">SHINKAWA / DEV SYSTEMS</text>
      <line x1="0" y1="33" x2="560" y2="33" stroke="#78dcff" opacity="0.24"/>
    </g>

    <text x="0" y="104" fill="#f7fbff" font-size="44" font-weight="700" letter-spacing="0.5">SHINJI SHINKAWA</text>
    <rect x="0" y="128" width="486" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="165" fill="#a9c4da" font-size="14" letter-spacing="0.5">FULL-STACK DEVELOPMENT / AI WORKFLOWS</text>

    <g transform="translate(0 210)" font-size="11" letter-spacing="0.25">
      <g>
        <rect width="160" height="36" rx="18" fill="#0e2944" stroke="#25d0ff" stroke-opacity="0.35"/>
        <text x="80" y="23" fill="#dff8ff" text-anchor="middle">WEB APPLICATION</text>
      </g>
      <g transform="translate(174 0)">
        <rect width="188" height="36" rx="18" fill="#0e2944" stroke="#25d0ff" stroke-opacity="0.35"/>
        <text x="94" y="23" fill="#dff8ff" text-anchor="middle">BUSINESS AUTOMATION</text>
      </g>
      <g transform="translate(376 0)">
        <rect width="126" height="36" rx="18" fill="#0e2944" stroke="#25d0ff" stroke-opacity="0.35"/>
        <text x="63" y="23" fill="#dff8ff" text-anchor="middle">MVP / PoC</text>
      </g>
    </g>

    <text x="0" y="295" fill="#55728f" font-size="13" letter-spacing="2">BUILD  /  VERIFY  /  IMPROVE</text>
  </g>

  <g transform="translate(716 58)" class="mono">
    <rect width="420" height="284" rx="16" fill="#071523" stroke="#2bbcff" stroke-opacity="0.38"/>
    <rect width="420" height="46" rx="16" fill="#0c2238"/>
    <path d="M0 30 Q0 46 16 46 H404 Q420 46 420 30 V46 H0Z" fill="#0c2238"/>
    <circle cx="24" cy="23" r="5" fill="#ff6b6b"/>
    <circle cx="43" cy="23" r="5" fill="#ffd166"/>
    <circle cx="62" cy="23" r="5" fill="#56e39f"/>
    <text x="210" y="28" fill="#6f91ae" font-size="12" text-anchor="middle" letter-spacing="1">PROFILE.SYS</text>

    <g transform="translate(28 78)">
      <text class="label" x="0" y="0">ROLE</text>
      <text class="value" x="120" y="0">FULL-STACK DEVELOPER</text>

      <text class="label" x="0" y="42">CORE</text>
      <text class="value" x="120" y="42">TYPESCRIPT / NEXT.JS</text>

      <text class="label" x="0" y="84">FOCUS</text>
      <text class="value" x="120" y="84">BUILD + IMPROVE</text>

      <text class="label" x="0" y="126">WEB DEV</text>
      <text class="value" x="120" y="126">2021 — PRESENT</text>

      <text class="label" x="0" y="168">BASE</text>
      <text class="value" x="120" y="168">JAPAN</text>

      <g transform="translate(0 199)">
        <rect width="364" height="1" fill="#2bbcff" opacity="0.18"/>
        <circle cx="7" cy="22" r="4" fill="#56e39f" filter="url(#glow)"/>
        <text x="20" y="27" fill="#56e39f" font-size="13" letter-spacing="2">READY TO SHIP</text>
        <rect x="337" y="15" width="8" height="15" fill="#25d0ff" opacity="0.85"/>
      </g>
    </g>
  </g>

  <path d="M690 70 V330" stroke="#2bbcff" stroke-dasharray="2 8" opacity="0.22"/>
  <path d="M1172 116 V284" stroke="#2bbcff" stroke-width="2" opacity="0.45"/>
  <circle cx="1172" cy="104" r="4" fill="#25d0ff"/>
  <circle cx="1172" cy="296" r="4" fill="#25d0ff"/>
  <rect x="1" y="1" width="1198" height="398" rx="23" fill="none" stroke="#77dcff" stroke-opacity="0.14" stroke-width="2"/>
</svg>
